project:
  type: website
  output-dir: _site
  resources:
    - country_bulletins/**/*.pdf
  render:
    - index.qmd
    - technical.qmd
    - data-model.qmd
    - api.qmd
    - mcp.qmd
    - bulletin_comparison.qmd

website:
  title: "Национальная торговая статистика"
  favicon: assets/mgimo-logo.svg
  navbar:
    left:
      - text: "Главная"
        href: index.qmd
      - text: "Документация"
        menu:
          - text: "Методология"
            href: technical.qmd
          - text: "Модель данных"
            href: data-model.qmd
          - text: "Доступ по API"
            href: api.qmd
          - text: "ИИ-агент (MCP)"
            href: mcp.qmd
      - text: "Месячный бюллетень"
        menu:
          - text: "Сводный обзор"
            href: bulletin_comparison.qmd
          - text: "Китай"
            href: country_bulletins/china/bulletin_china_pdf.qmd
          - text: "Индия"
            href: country_bulletins/india/bulletin_india_pdf.qmd
          - text: "Турция"
            href: country_bulletins/turkey/bulletin_turkey_pdf.qmd
      # Занятия рендерятся отдельным (корневым) проектом; в локальном превью
      # ссылаемся на опубликованные слайды, чтобы не требовать их сборки здесь.
      - text: "Дашборды"
        href: https://nts.mgimo.ru/superset/
        target: _blank
      - text: "Презентации"
        menu:
          - text: "Обзор проекта"
            href: https://quantviews.github.io/mgimo-foreign-trade/presentations/project-overview.html
          - text: "1. Введение в таможенную статистику"
            href: https://quantviews.github.io/mgimo-foreign-trade/lessons/lesson_01_intro.html
          - text: "2. Старая и новая статистика"
            href: https://quantviews.github.io/mgimo-foreign-trade/lessons/lesson_02_old_new_stats.html
          - text: "3. DuckDB и SQL"
            href: https://quantviews.github.io/mgimo-foreign-trade/lessons/lesson_03_duckdb.html
          - text: "4. Superset и дашборды"
            href: https://quantviews.github.io/mgimo-foreign-trade/lessons/lesson_04_superset.html
          - text: "5. Визуализация данных и бизнес-аналитика"
            href: https://quantviews.github.io/mgimo-foreign-trade/presentations/dataviz-story.html

format:
  html:
    theme:
      - cosmo
      - styles/mgimo.scss
    mermaid:
      theme: neutral
    toc: false
    lang: ru
