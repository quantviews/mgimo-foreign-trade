        target: _blank
      - text: "Спросить ИИ"
        href: site/demo.qmd
      - text: "Презентации"
        menu:
          - text: "Обзор проекта"
            href: ../presentations/project-overview.html
          - text: "1. Введение в таможенную статистику"
            href: lessons/lesson_01_intro.qmd
          - text: "2. Старая и новая статистика"
            href: lessons/lesson_02_old_new_stats.qmd
          - text: "3. DuckDB и SQL"
            href: lessons/lesson_03_duckdb.qmd
          - text: "4. Superset и дашборды"
