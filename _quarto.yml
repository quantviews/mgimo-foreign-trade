project:
  type: website
  output-dir: _site
  resources:
    - site/country_bulletins/**/*.pdf
  render:
    - site/index.qmd
    - site/technical.qmd
    - site/bulletin_comparison.qmd
    - other/intro-presentation.qmd
    - other/foreign-trade-slide-2026.qmd
    - lessons/lesson_01_intro.qmd
    - lessons/lesson_02_old_new_stats.qmd
    - lessons/lesson_03_duckdb.qmd
    - lessons/lesson_04_superset.qmd

website:
  title: "Национальная торговая статистика"
  favicon: site/assets/mgimo-logo.svg
  navbar:
    left:
      - text: "Главная"
        href: site/index.qmd
      - text: "Техническая документация"
        href: site/technical.qmd
      - text: "Месячный бюллетень"
        menu:
          - text: "Сводный обзор"
            href: site/bulletin_comparison.qmd
          - text: "Китай (PDF)"
            href: site/country_bulletins/china/bulletin_china_pdf.pdf
          - text: "Индия (PDF)"
            href: site/country_bulletins/india/bulletin_india_pdf.pdf
          - text: "Турция (PDF)"
            href: site/country_bulletins/turkey/bulletin_turkey_pdf.pdf
      - text: "Презентации"
        menu:
          - text: "Обзор проекта"
            href: ../presentations/project-overview.html
          - text: "1. Введение в таможенную статистику"
            href: lessons/lesson_01_intro.qmd
          - text: "2. Старая и новая статистика"
            href: lessons/lesson_02_old_new_stats.qmd
          - text: "3. DuckDB и SQL"
            href: lessons/lesson_03_duckdb.qmd
          - text: "4. Superset и дашборды"
            href: lessons/lesson_04_superset.qmd
          - text: "5. Визуализация данных и бизнес-аналитика"
            href: ../presentations/dataviz-story.html

format:
  html:
    theme:
      - cosmo
      - site/styles/mgimo.scss
    mermaid:
      theme: neutral
    toc: false
    lang: ru
