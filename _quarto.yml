project:
  type: website
  output-dir: _site
  resources:
    - site/country_bulletins/**/*.pdf
  render:
    - site/index.qmd
    - site/technical.qmd
    - site/data-model.qmd
    - site/api.qmd
    - site/mcp.qmd
    - site/demo.qmd
    - site/bulletin_comparison.qmd
    - other/intro-presentation.qmd
    - other/foreign-trade-slide-2026.qmd
    - lessons/lesson_01_intro.qmd
    - lessons/lesson_02_old_new_stats.qmd
    - lessons/lesson_03_duckdb.qmd
    - lessons/lesson_04_superset.qmd
    # Страновые бюллетени НЕ здесь: у них есть pdf-формат (нужны xelatex + Arial),
    # а GitHub Pages CI их не имеет. Их добавляет профиль vps (_quarto-vps.yml),
    # которым локальный деплой на VPS собирает html + pdf. Профили Quarto
    # ДОБАВЛЯЮТ элементы render, а не заменяют список, поэтому база остаётся чистой.

website:
  title: "Национальная торговая статистика"
  favicon: site/assets/mgimo-logo.svg
  navbar:
    left:
      - text: "Главная"
        href: site/index.qmd
      - text: "Документация"
        menu:
          - text: "Методология"
            href: site/technical.qmd
          - text: "Модель данных"
            href: site/data-model.qmd
          - text: "Доступ по API"
            href: site/api.qmd
          - text: "ИИ-агент (MCP)"
            href: site/mcp.qmd
      - text: "Месячный бюллетень"
        menu:
          - text: "Сводный обзор"
            href: site/bulletin_comparison.qmd
          - text: "Китай"
            href: site/country_bulletins/china/bulletin_china_pdf.qmd
          - text: "Индия"
            href: site/country_bulletins/india/bulletin_india_pdf.qmd
          - text: "Турция"
            href: site/country_bulletins/turkey/bulletin_turkey_pdf.qmd
      - text: "Дашборды"
