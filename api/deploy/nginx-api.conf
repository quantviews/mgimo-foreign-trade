# nginx reverse proxy for the trade API.
# Use this ONCE A DOMAIN + TLS ARE READY. During the pilot the API is reachable
# directly on :8090 over HTTP (see docker-compose.yml) — restrict access by firewall
# until TLS exists, because tokens travel in clear over plain HTTP.

# --- Pilot / no domain yet (HTTP only) -------------------------------------
server {
    listen 80;
    server_name _;                      # replace with api.<domain> when ready

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

