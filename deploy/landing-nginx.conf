# nginx для контейнера `landing`:
#   :80  - acme-challenge (выпуск/продление Let's Encrypt) + редирект на https
#   :443 - статический лендинг (/home/marcel/mgimo-landing) + прокси Superset
#
# TLS: Let's Encrypt, сертификат только на nts.mgimo.ru, автопродление через
# /home/marcel/renew-cert.sh (cron, еженедельно). Сертификат и acme-webroot
# смонтированы в контейнер (см. docs/vps-landing.md, раздел «HTTPS»).
#
# Контейнер `landing` подключён к сети `superset_default`, поэтому обращается к
# Superset по имени сервиса. В superset_config.py включён ENABLE_PROXY_FIX=True,
# поэтому Superset учитывает X-Forwarded-Proto/Prefix и строит https-ссылки и
# ассеты под /superset. Прямой доступ по :8088 (http) при этом сохраняется.
#
# Установка на VPS - см. docs/vps-landing.md.

# HTTP: только acme-challenge и редирект всего остального на HTTPS
server {
    listen 80;
    server_name nts.mgimo.ru _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: лендинг + реверс-прокси Superset
server {
    listen 443 ssl;
    http2 on;
    server_name nts.mgimo.ru _;

    ssl_certificate     /etc/letsencrypt/live/nts.mgimo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nts.mgimo.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=15768000" always;

    root /usr/share/nginx/html;
    index index.html;

    # acme и на 443 (безвредно; на случай продления после https-редиректа)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Статический лендинг
    location / {
        try_files $uri $uri/ =404;
    }

    # Superset под подпутём /superset
    location = /superset {
        return 301 /superset/;
    }

    # Голый /static/ Superset использует для бренд-логотипа (APP_ICON у Superset
    # захардкожен как /static/assets/images/superset-logo-horiz.png и не получает
    # префикс /superset). Проксируем его на Superset, иначе логотип даёт 404.
    location /static/ {
        proxy_pass http://superset-superset-1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # У Superset собственные маршруты живут под /superset/* (welcome, explore,
    # sqllab), поэтому под нашим внешним /superset их корректный внешний адрес -
    # ДВОЙНОЙ /superset/superset/... . FAB после логина строит `next` из уже
    # очищенного от префикса PATH_INFO и теряет один сегмент (даёт одинарный
    # /superset/welcome/ -> 404). Возвращаем недостающий префикс.
    # Список - только blueprint-страницы Superset; корневые маршруты
    # (/superset/login|api|static|health|dashboard/list|chart/list) не трогаем.
    location ~ ^/superset/(welcome|explore|sqllab|profile)(/.*)?$ {
        return 301 /superset/superset/$1$2;
    }

    location /superset/ {
        proxy_pass http://superset-superset-1:8088/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /superset;

        # WebSocket / async (SQL Lab, live-обновления)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
        proxy_buffering off;
    }

    # OAuth-эндпоинты MCP-сервера (FastMCP монтирует их в корне). issuer =
    # https://nts.mgimo.ru, поэтому клиенты (Claude web/mobile, ChatGPT) ходят на
    # /authorize, /token, /register, /revoke, /oauth/login и /.well-known/oauth-*.
    # acme-challenge на ^~ приоритетнее этой regex-локации, конфликта нет.
    location ~ ^/(register|authorize|token|revoke|oauth/|\.well-known/oauth-(authorization-server|protected-resource)) {
        proxy_pass http://trade-mcp:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Удалённый MCP-сервер (streamable-http) на /mcp. Токен клиента идёт в
    # заголовке Authorization и прокидывается контейнером в API. SSE-стрим
    # сервер→клиент: буферизацию выключаем, таймаут длинный.
    location /mcp {
        proxy_pass http://trade-mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Демо ИИ-чат (сервис trade-demo, порт 8000). Маршруты уже под /demo/*
    # (register, verify, me, chat, health), поэтому префикс не срезаем. Ответ chat -
    # SSE-стрим, так что буферизацию выключаем и держим длинный таймаут. Статическая
    # страница чата отдаётся отдельно как /site/demo.html.
    location /demo/ {
        proxy_pass http://trade-demo:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Trade API под /api/ (реверс-прокси на контейнер trade-api, порт 8000).
    # Слэш в proxy_pass срезает префикс /api; X-Forwarded-Prefix возвращает его
    # приложению (root_path), поэтому OData-URL и Swagger openapi ссылаются на
    # /api. Прямой доступ по :8090 при этом сохраняется.
    location = /api { return 301 /api/; }
    location /api/ {
        proxy_pass http://trade-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
        proxy_buffering off;
    }
}
