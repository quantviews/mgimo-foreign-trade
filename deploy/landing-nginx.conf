# nginx для контейнера `landing`:
#   /           - статический лендинг (Quarto, /home/marcel/mgimo-landing)
#   /superset/  - реверс-прокси на Superset (superset-superset-1:8088)
#
# Контейнер `landing` подключён к сети `superset_default`, поэтому обращается к
# Superset по имени сервиса. В superset_config.py включён ENABLE_PROXY_FIX=True,
# поэтому Superset учитывает X-Forwarded-Prefix и строит свои ссылки/ассеты под
# /superset. Прямой доступ по :8088 при этом сохраняется.
#
# Установка на VPS - см. docs/vps-landing.md (раздел «Superset под /superset»).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статический лендинг
    location / {
        try_files $uri $uri/ =404;
    }

    # Superset под подпутём /superset
    location = /superset {
        return 301 /superset/;
    }

    # У Superset собственные маршруты живут под /superset/* (welcome, explore,
    # sqllab), поэтому под нашим внешним /superset их корректный внешний адрес -
    # ДВОЙНОЙ /superset/superset/... . FAB после логина строит `next` из уже
    # очищенного от префикса PATH_INFO и теряет один сегмент (даёт одинарный
    # /superset/welcome/ -> 404). Возвращаем недостающий префикс.
    # Список — только blueprint-страницы Superset; корневые маршруты
    # (/superset/login|api|static|health|dashboard/list|chart/list) не трогаем.
    location ~ ^/superset/(welcome|explore|sqllab|profile)(/.*)?$ {
        return 301 /superset/superset/$1$2;
    }

    location /superset/ {
        proxy_pass http://superset-superset-1:8088/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /superset;

        # WebSocket / async (SQL Lab, live-обновления)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
        proxy_buffering off;
    }
}
