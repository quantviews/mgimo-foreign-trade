name: Python Tests

on:
  push:
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "src/**/*.R"
      - "sql/**"
      - "metadata/publication_registry.json"
      - "scripts/*fisher*.R"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "src/**/*.R"
      - "sql/**"
      - "metadata/publication_registry.json"
      - "scripts/*fisher*.R"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MGIMO_DUCKDB_TMPDIR: /tmp/mgimo_foreign_trade_duckdb

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Ставим выборочно, но версии берём из requirements.txt через -c:
      # иначе pip тянет последние, и CI ломается на мажорных релизах чужих
      # пакетов. Так было с pandas 3, где строковые колонки получили отдельный
      # dtype вместо object и проверки контракта перестали проходить.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -c requirements.txt pytest pandas numpy duckdb pyarrow beautifulsoup4

      - name: Show resolved versions
        run: python -m pip list

      - name: Run pytest
        run: pytest -q

  fisher-methodology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::slider
            any::duckdb
            any::DBI
            any::jsonlite
      - name: Check Fisher fixtures and optimized chain equivalence
        run: |
          mkdir -p tmp
          Rscript scripts/audit_fizob_fisher.R tmp/fisher-ci-audit.json
          Rscript scripts/test_fisher_chain_equivalence.R
