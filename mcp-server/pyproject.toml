[project]
name = "mgimo-trade-mcp"
version = "0.1.0"
description = "MCP server for the MGIMO foreign-trade API (read-only)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
mgimo-trade-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[tool.hatch.build.targets.wheel]
include = ["server.py"]
