[project]
name = "mgimo-trade-mcp"
version = "0.1.0"
description = "MCP server for the MGIMO foreign-trade API (read-only)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27", "asyncpg>=0.29"]

[project.scripts]
mgimo-trade-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# decomposition.py, trade_evidence.py, query_contract.py, numeric_facts.py,
# product_overview.py and product_search.py now live in ../shared/trade_tools_shared
# (shared with demo/). This wheel is only meant to be built from inside the
# monorepo checkout, where server.py's sys.path bootstrap finds that package;
# it is not a standalone PyPI-publishable artifact.
include = ["server.py", "oauth.py", "coverage_evidence.py"]
